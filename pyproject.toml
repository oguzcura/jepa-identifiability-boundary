[project]
name = "jepa-identifiability-boundary"
version = "0.1.0"
description = "Empirical boundary map of latent identifiability in JEPA-style models (Klindt-LeCun-Balestriero theorem empiricized)."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "pytest",
]

[project.scripts]
# NOTE: no console entry points. The pipeline runs as scripts:
#   uv run python repro/run_sweep.py --stage N
#   uv run python repro/analyze_report.py
#   uv run python repro/figures.py
#   uv run pytest tests/ -q
# (src/jepa_id is a library consumed by repro/.)

[tool.pytest.ini_options]
testpaths = ["tests"]
